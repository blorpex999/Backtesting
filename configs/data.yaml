download:
  tool: dukascopy-node
  version: "1.50.0"          # version épinglée (npm)
  history_start: 2009-01-01  # début de la chauffe ; l'IS commence en 2010
  # Dukascopy limite le débit de son API (HTTP 429, blocage observé après une soixantaine
  # de requêtes en rafale) : une requête à la fois, environ 0,6 requête/s.
  batch_size: 1              # requêtes parallèles par lot
  batch_pause_ms: 1500       # pause entre deux requêtes (et entre deux mois)
  retries: 1                 # au moins 1 : avec 0, dukascopy-node masque les erreurs réseau ;
                             # pas plus : pendant un blocage, insister le prolonge
  retry_pause_ms: 10000      # pause avant la reprise d'une requête
  timeout_s: 3600            # par mois et par côté (BID / ASK)
  # En cas de HTTP 429 : pause (60 s, puis doublée à chaque fois, 900 s au plus),
  # débit réduit, et nouvel essai du même mois ; arrêt propre après 6 pauses.
  rate_limit_wait_s: 60
  rate_limit_max_wait_s: 900
  rate_limit_max_waits: 6
  max_consecutive_failures: 3  # arrêt après N mois de suite en échec (autre cause)

quality:
  # Fuseau des « jours » du contrôle qualité (et des jours exclus).
  day_timezone: Europe/Paris
  gap_warn_minutes: 15          # trou signalé (avertissement)
  gap_invalid_minutes: 60       # trou qui invalide le jour
  min_day_coverage: 0.90        # minutes observées / minutes de cotation attendues
  spread_outlier_factor: 10.0   # spread > facteur × médiane du jour
  spread_outlier_max_share: 0.02
  max_negative_spread_minutes: 0
  max_one_sided_minutes: 5      # minutes avec BID sans ASK (ou l'inverse)
  max_invalid_ohlc_minutes: 0
  low_liquidity_days: ["12-24", "12-25", "12-31", "01-01"]
  exclude_low_liquidity: true
