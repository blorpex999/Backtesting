[project]
name = "backtest-lab"
version = "0.1.0"
description = "Plateforme locale de backtest de stratégies par blocs (recherche uniquement, aucun ordre réel)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
btlab = "btlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text uses typographic characters
